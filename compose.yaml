services:
  postgres:
    image: postgres:17
    container_name: affiliatelink-postgres
    environment:
      POSTGRES_DB: affiliatelink
      POSTGRES_USER: redouane
      POSTGRES_PASSWORD: redouane123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: