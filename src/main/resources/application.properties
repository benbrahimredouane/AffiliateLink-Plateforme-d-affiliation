spring.config.import=optional:file:.env[.properties]
spring.application.name=affiliatelink

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/affiliatelink
spring.datasource.username=redouane
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate

# Flyway database migrations
spring.flyway.enabled=true

#disable it to avoid unintended database queries during web response processing.
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.show-sql=true
